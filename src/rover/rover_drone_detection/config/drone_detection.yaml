/**/drone_detection_node:
  ros__parameters:
    # --- Model (detector.Detector) ---
    # A file name is looked up in share/rover_drone_detection/models; a path is
    # used as is (e.g. a TensorRT .engine exported on the Jetson).
    #   drone_yolo11s_640.pt  cv-yolo11s fold1, 19 MB, mAP50 0.73 on its fold, CV mean 0.52
    #                         (default: the only one that finds the small far drones, see models/README.md)
    #   drone_yolo26n_640.pt  yolo26n-640-4, 5.4 MB, mAP50 0.56; ~2x faster but misses most small drones
    model: drone_yolo11s_640.pt
    conf: 0.25                  # minimum score; yolo11s scores true drones ~0.3-0.6
    iou: 0.5                    # NMS IoU (yolo26 is NMS-free and ignores it)
    imgsz: 640                  # inference size, the one both models were trained at
    device: ''                  # '' = cuda:0 if there is one, else cpu; or 'cpu', '0'
    half: false                 # FP16, CUDA only
    rate: 10.0                  # [Hz] at most; the newest frame only, older ones are dropped
