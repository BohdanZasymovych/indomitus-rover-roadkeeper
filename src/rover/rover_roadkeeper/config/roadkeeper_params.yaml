/**/road_offset_perception_node:
  ros__parameters:
    image_topic: "/rover/front_camera/image_raw"
    offset_topic: "/rover/road_offset"            # geometry_msgs/Vector3Stamped: x=offset, y=conf, z=valid
    debug_image_topic: "/rover/road_perception/debug_image"
    weights_path: ""                              # "" -> <share>/rover_roadkeeper/weights/road_segmenter_best.pt
    prob_threshold: 0.65
    device: ""                                    # "" -> cuda if available, else cpu
    publish_debug_image: false
